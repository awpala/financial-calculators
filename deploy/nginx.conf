server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # Coolify terminates HTTPS. Keep directory redirects relative so Nginx does
    # not expose its internal HTTP scheme and port in public Location headers.
    absolute_redirect off;

    # Directory indexes support direct links without an SPA fallback.
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ =404;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location /_app/immutable/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
}
