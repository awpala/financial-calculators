name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Host checks use browser mocks; the Docker builder supplies real Chromium.
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  application:
    name: SvelteKit and infrastructure gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      # The Dockerfile performs the production build. Check that image's HTTP
      # contract without repeating the build or application tests on the host.
      - name: Build and exercise the production Nginx image
        run: npm run test:container
      - name: Shell syntax and ADR index
        run: |
          find .devcontainer scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n cleanup.sh
          sudo ln -s "$GITHUB_WORKSPACE" /workspace
          bash .devcontainer/scripts/bin/check-adr-index.sh
