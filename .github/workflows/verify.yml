name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  application:
    name: SvelteKit and infrastructure gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install the browser used by document transforms
        run: npx puppeteer browsers install chrome --install-deps
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run test:deployment
      - name: Build and exercise the production Nginx image
        run: npm run test:container
      - name: Shell syntax and ADR index
        run: |
          find .devcontainer scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n cleanup.sh
          sudo ln -s "$GITHUB_WORKSPACE" /workspace
          bash .devcontainer/scripts/bin/check-adr-index.sh
