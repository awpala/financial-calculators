name: Deploy to Coolify

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coolify-deployment
  cancel-in-progress: false

# Enable after the production resource is configured. Coolify Auto Deploy must
# be disabled so a push cannot bypass Verify and its production-image checks.
jobs:
  deploy:
    if: >-
      vars.COOLIFY_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://fincalcs.portfolio-projects.dev
    steps:
      - name: Reject a superseded release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" = "$RELEASE_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping superseded commit.'
          fi
      - name: Request Coolify deployment
        if: steps.current.outputs.deploy == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          : "${COOLIFY_WEBHOOK:?COOLIFY_WEBHOOK secret is required}"
          : "${COOLIFY_TOKEN:?COOLIFY_TOKEN secret is required}"
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 60 \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
